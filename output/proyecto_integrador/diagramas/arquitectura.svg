ado</tspan></text><rect x="120" y="430" width="760" height="105" rx="10" fill="#fff2dc" stroke="#956221" stroke-width="2" stroke-dasharray="7 5"/><text x="500.0" y="461.92" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#203447"><tspan x="500.0" dy="0">P Servicios de negocio</tspan><tspan x="500.0" dy="27.3">estudiantes · docentes · cursos · matrículas · pagos · identidad</tspan><tspan x="500.0" dy="27.3">Reutilizan reglas académicas actuales</tspan></text><polyline points="500,375 500,430" fill="none" stroke="#536878" stroke-width="2" /><polygon points="500,430 495.0,418.0 505.0,418.0" fill="#536878"/><rect x="120" y="590" width="350" height="90" rx="10" fill="#eaf2f9" stroke="#315b7d" stroke-width="2" /><text x="295.0" y="628.07" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#203447"><tspan x="295.0" dy="0">E Persistencia Eloquent</tspan><tspan x="295.0" dy="27.3">P modelos nuevos</tspan></text><rect x="530" y="590" width="350" height="90" rx="10" fill="#fff2dc" stroke="#956221" stroke-width="2" stroke-dasharray="7 5"/><text x="705.0" y="628.73" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#203447"><tspan x="705.0" dy="0">P Integraciones</tspan><tspan x="705.0" dy="24.7">BancoSoapAdapter · OidcAdapter</tspan></text><polyline points="350,535 295,590" fill="none" stroke="#536878" stroke-width="2" /><polygon points="295,590 299.9497474683059,577.9791847198287 307.0208152801713,585.0502525316942" fill="#536878"/><polyline points="650,535 705,590" fill="none" stroke="#536878" stroke-width="2" /><polygon points="705,590 692.9791847198287,585.0502525316942 700.0502525316942,577.9791847198287" fill="#536878"/><rect x="120" y="710" width="760" height="45" rx="10" fill="#fff2dc" stroke="#956221" stroke-width="2" stroke-dasharray="7 5"/><text x="500.0" y="738.58" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" 